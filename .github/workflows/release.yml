name: Release

# Push a tag like 0.2.1 (no "v"). This builds the plugin, signs the files
# with a build attestation, and publishes the release.
on:
  push:
    tags: ["*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # checkout fetches the tag without its message; get the full tag for the notes.
      - run: git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx eslint src
      - run: npm run build

      - name: Check the tag matches manifest.json
        run: test "$(node -p "require('./manifest.json').version")" = "$GITHUB_REF_NAME"

      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Take the notes for this version from CHANGELOG.md
        run: awk -v v="$GITHUB_REF_NAME" -f .github/notes.awk CHANGELOG.md > notes.md && test -s notes.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" main.js manifest.json styles.css --title "$GITHUB_REF_NAME" --notes-file notes.md
